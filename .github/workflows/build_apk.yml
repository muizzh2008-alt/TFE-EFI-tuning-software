
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Clean Project
        working-directory: mobile_ecutuner
        run: flutter clean

      - name: Remove Old Lockfile
        working-directory: mobile_ecutuner
        run: rm -f pubspec.lock

      - name: Get Dependencies
        working-directory: mobile_ecutuner
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile_ecutuner
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECUTuner-V61-Release-APK
          path: mobile_ecutuner/build/app/outputs/flutter-apk/app-release.apk
